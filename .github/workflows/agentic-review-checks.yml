---
name: Agentic review checks

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - '.github/aw/**'
      - '.github/linters/actionlint.yml'
      - '.github/scripts/**'
      - '.github/workflows/agentic-review*'
      - '.github/workflows/shared/agentic-review.md'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the pinned compiler
        env:
          GH_AW_DOWNLOAD: https://github.com/github/gh-aw/releases/download/v1.0.1/linux-amd64
        run: |
          curl --fail --location --retry 3 "$GH_AW_DOWNLOAD" -o "$RUNNER_TEMP/gh-aw-compiler"
          compiler_checksum='746d0b41d5fb87e2c010b8ac23a464436bb745ff89fbd19a3456431942c37652'
          echo "$compiler_checksum  $RUNNER_TEMP/gh-aw-compiler" | sha256sum --check
          chmod +x "$RUNNER_TEMP/gh-aw-compiler"
      - name: Check generated workflows
        env:
          GH_AW_BIN: ${{ runner.temp }}/gh-aw-compiler
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/compile-agentic-reviews.sh
          git diff --exit-code -- .gitattributes .github/aw/actions-lock.json \
            .github/workflows/agentic-review-copilot.lock.yml .github/workflows/agentic-review-codex.lock.yml
      - name: Install workflow test dependencies
        working-directory: .github/scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test workflow helpers and security contracts
        working-directory: .github/scripts
        run: npm test -- --runInBand
