---
name: Agentic branch review

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number in this repository, or leave empty to review a branch
        type: string
        default: ''
      target_ref:
        description: Branch, tag or commit to review when no pull request number is supplied
        type: string
        default: ''
      base_ref:
        description: Comparison base for a branch review; pull requests use their own base
        type: string
        default: main
      environment:
        description: Environment containing the selected engine's secrets and optional variables
        type: environment
        default: CICD
        required: true

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: agentic-review-${{ inputs.pull_request_number || inputs.target_ref }}
  cancel-in-progress: false

jobs:
  select-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      harness: ${{ steps.select.outputs.harness }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Select the configured harness
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AGENT_HARNESS: ${{ vars.AGENT_HARNESS }}
        with:
          script: |
            const { selectHarness } = require('./.github/scripts/agentic-review.js');
            core.setOutput('harness', selectHarness(process.env.AGENT_HARNESS));

  copilot:
    needs: select-harness
    if: needs.select-harness.outputs.harness == 'copilot'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      copilot-requests: write
    uses: ./.github/workflows/agentic-review-copilot.lock.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      target_ref: ${{ inputs.target_ref }}
      base_ref: ${{ inputs.base_ref }}
      environment: ${{ inputs.environment }}

  codex-preflight:
    needs: select-harness
    if: needs.select-harness.outputs.harness == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate the selected Codex environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo '::error::OPENAI_API_KEY is empty or unavailable in the selected environment.'
            exit 1
          fi
          echo 'OPENAI_API_KEY is available in the selected environment.'

  codex:
    needs: [select-harness, codex-preflight]
    if: needs.select-harness.outputs.harness == 'codex'
    uses: ./.github/workflows/agentic-review-codex.lock.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      target_ref: ${{ inputs.target_ref }}
      base_ref: ${{ inputs.base_ref }}
      environment: ${{ inputs.environment }}
